name: Publicar documentação (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Instalar o R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependências do R
        run: |
          # Confia nos repositórios configurados por setup-r (RSPM -> binários).
          # NÃO sobrescreva options(repos), senão os pacotes com código compilado
          # (ex.: rmarkdown) passam a vir do fonte e podem falhar silenciosamente.
          install.packages(c("knitr", "rmarkdown"), Ncpus = 2)
          faltando <- setdiff(c("knitr", "rmarkdown"), rownames(installed.packages()))
          if (length(faltando) > 0) {
            stop("Falha ao instalar pacotes: ", paste(faltando, collapse = ", "))
          }
        shell: Rscript {0}

      - name: Instalar o Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderizar a documentação em HTML
        run: quarto render --profile pages
        working-directory: vignettes

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar o artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: vignettes/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
